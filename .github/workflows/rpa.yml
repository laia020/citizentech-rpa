name: Lote CitizenTech RPA
run-name: RPA ${{ inputs.modo }} - ${{ inputs.exemplo }}
on:
  workflow_dispatch:
    inputs:
      modo:
        description: 'Simulado: sem rede. Real: IA pública, somente dados fictícios.'
        type: choice
        options: [simulado, real]
        default: simulado
      exemplo:
        description: Lote fictício pequeno
        type: choice
        options: [lote-demo.json, lote-demo.csv, lote-real.json]
        default: lote-demo.json
      estado_run_id:
        description: 'ID da execução MAIS RECENTE com rpa-state. Vazio apenas na primeira execução.'
        type: string
        default: ''
      iniciar_estado:
        description: 'Confirmo início de estado novo: não deduplica execuções anteriores.'
        type: boolean
        default: false
      retomar_falhas:
        description: 'Retomar falhas HTTP 429/503. Sucessos e resultados incertos são preservados.'
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: citizentech-rpa-lotes
  cancel-in-progress: false
jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.6"
      - run: uv sync --locked --no-default-groups
      - name: Restaurar estado e processar lote
        id: lote
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RPA_MODE: ${{ inputs.modo }}
          RPA_EXAMPLE: ${{ inputs.exemplo }}
          RPA_PREVIOUS_RUN: ${{ inputs.estado_run_id }}
          RPA_INITIALIZE: ${{ inputs.iniciar_estado }}
          RPA_RESUME: ${{ inputs.retomar_falhas }}
        run: uv run --no-sync python scripts/cloud_run.py
      - name: Arquivar estado para próxima execução
        if: always() && steps.lote.outputs.estado_pronto == 'true' && hashFiles('state/ocorrencias.sqlite3') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rpa-state
          path: state/ocorrencias.sqlite3
          retention-days: 14
          if-no-files-found: error
      - name: Arquivar resultados mesmo em falha da API
        if: always() && hashFiles('runs/**/resumo.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rpa-resultados
          path: runs/
          retention-days: 14
          if-no-files-found: error
